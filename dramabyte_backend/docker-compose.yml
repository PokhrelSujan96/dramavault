services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
  worker:
    build: .
    env_file: .env
    command: celery -A app.infrastructure.queue.celery_app worker --loglevel=INFO
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  redis_data:
