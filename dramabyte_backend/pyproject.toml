[project]
name = "dramabyte-backend"
version = "0.1.0"
description = "DramaByte production and publishing API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "boto3>=1.40,<2",
  "celery[redis]>=5.5,<6",
  "fal-client>=0.7,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<7",
  "structlog>=25,<26",
  "supabase>=2.18,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/test_hybrid_rendering.py" = ["S603"]
"tests/test_dialogue_audio.py" = ["S603"]
"tests/test_audio_waveform.py" = ["S603"]
"app/infrastructure/rendering.py" = ["S603"]
"app/infrastructure/hybrid_rendering.py" = ["S603"]
"app/infrastructure/reference_images.py" = ["S603"]
"app/infrastructure/voice_validation.py" = ["S603"]
"app/infrastructure/speech_alignment.py" = ["S603"]
"app/infrastructure/audio_waveform.py" = ["S603"]
"app/infrastructure/dialogue_audio.py" = ["S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_decorators = false
